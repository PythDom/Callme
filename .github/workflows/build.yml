name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CALLME_VERSION_CODE: ${{ github.run_number }}
      CALLME_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a stable signing key lets new APKs install over old ones.
      # Without these secrets the APK is signed with a throwaway debug key.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CALLME_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/callme.jks"
          echo "CALLME_KEYSTORE_FILE=$RUNNER_TEMP/callme.jks" >> "$GITHUB_ENV"

      - name: Lint and build release APK
        env:
          CALLME_KEYSTORE_PASSWORD: ${{ secrets.CALLME_KEYSTORE_PASSWORD }}
          CALLME_KEY_ALIAS: ${{ secrets.CALLME_KEY_ALIAS }}
          CALLME_KEY_PASSWORD: ${{ secrets.CALLME_KEY_PASSWORD }}
        run: ./gradlew lintDebug assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "Callme-${CALLME_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Callme-${{ env.CALLME_VERSION_NAME }}
          path: Callme-*.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Callme-*.apk
